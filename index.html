/* ─── Chrome tokens (switcher bar, independent of the figure themes) ─── */

/* ─── Theme 1: Kontur (black and white, sharp, mono labels) ─── */

  --n2-bg: var(--node-bg); --n2-fg: var(--node-fg);

  --alt-bg: var(--node-bg);
  --alt-fg: var(--node-fg);
  --alt-border-style: dashed;

  --step-color: #0a0a0a;
  --icon-color: currentColor;
  --link-color: #0a0a0a;
  --badge-bg: #0a0a0a;
  --badge-fg: #ffffff;
  --badge-border: 0;
  --badge-radius: 0;
  --alt-badge-bg: #ffffff;
  --alt-badge-fg: #0a0a0a;
  --alt-badge-border: 1px dashed #0a0a0a;
  --bar-radius: 0;

  --swap-border: 1.5px solid #0a0a0a;
  --swap-radius: 0;
  --swap-old-bg: #ffffff;
  --swap-old-fg: #0a0a0a;

/* ─── Theme 4: Redakcyjny (white, serif, double-rule boxes, small caps) ─── */
[data-theme="redakcja"] {

[data-theme="plan"] {

/* ─── Theme 6: Kolorowy (white, coloured full contours, pill labels) ─── */

[data-theme="kolor"] .step-no::after { display: none; }

[data-theme="rozjazd"] .cond {
  display: inline-flex; align-items: center; gap: 6px; margin: 0 0 8px;
  font-family: "JetBrains Mono", monospace; font-size: 11px; color: var(--decision);
  border: 1.5px solid var(--decision); border-radius: 999px; padding: 2px 9px;
}
[data-theme="rozjazd"] .or {
  display: flex; align-items: center; gap: 10px; margin: -10px 0;
  font-family: "JetBrains Mono", monospace; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; color: var(--decision);
}
[data-theme="rozjazd"] .or::before, [data-theme="rozjazd"] .or::after { content: ""; flex: 1; border-top: 1.5px dashed var(--decision); }
[data-theme="rozjazd"] .branch-links { position: relative; }
[data-theme="rozjazd"] .branch-links .link { margin-left: 22px; width: calc(100% - 22px); }
[data-theme="rozjazd"] .branch-links::before { content: ""; position: absolute; left: 21px; border-left: 1.5px solid #111827; top: calc(50% / var(--n)); bottom: calc(50% / var(--n)); }
[data-theme="rozjazd"] .branch-links[data-n="2"] { --n: 2; }
[data-theme="rozjazd"] .branch-links[data-n="3"] { --n: 3; }
[data-theme="rozjazd"] .decision {
  display: grid; place-items: center; position: absolute; z-index: 1; left: 6px; top: 50%; width: 32px; height: 32px; margin-top: -16px;
  background: var(--decision); color: #ffffff; transform: rotate(45deg); border-radius: 4px;
  font-family: "Space Grotesk", sans-serif; font-weight: 700; font-size: 17px;
}
[data-theme="rozjazd"] .decision b { transform: rotate(-45deg); }
[data-theme="rozjazd"] .branch-targets { gap: 18px; }

/* ─── Theme 10: Przykłady (example inputs A/B/C matched to the output each one produces) ─── */
[data-theme="przyklady"] {
  --page-bg: #ffffff;
  --page-fg: #18181b;
  --soft-fg: #3f3f46;
  --font-title: "Work Sans", system-ui, sans-serif;
  --font-body: "Work Sans", system-ui, sans-serif;
  --font-label: "Geist Mono", ui-monospace, monospace;
  --font-meta: "Work Sans", system-ui, sans-serif;
  --title-size: clamp(22px, 2.2vw, 28px);
  --title-weight: 800;
  --title-tracking: -0.025em;
  --node-title-size: 16px;
  --node-title-weight: 700;
  --meta-size: 13px;
  --body-size: 14.5px;

  --fig-bg: #fafafa;
  --fig-border: 1px solid #e4e4e7;
  --fig-radius: 8px;

  --node-bg: #ffffff;
  --node-fg: #18181b;
  --node-border: 1.5px solid #18181b;
  --node-radius: 6px;

  --step-color: #18181b;
  --link-color: #71717a;
  --badge-bg: #f4f4f5;
  --badge-fg: #18181b;
  --badge-radius: 4px;
  --alt-badge-bg: #f4f4f5;
  --alt-badge-fg: #18181b;
  --alt-badge-border: 0;
  --bar-radius: 2px;

  --swap-border: 1.5px solid #18181b;
  --swap-radius: 4px;
  --swap-new-bg: #18181b;
  --swap-new-fg: #ffffff;

  --k-a: #0f766e;
  --k-b: #c2410c;
  --k-c: #6d28d9;
}
[data-theme="przyklady"] .flowz .node[data-step="1"] > .quote { display: none; }
[data-theme="przyklady"] .inputs { display: flex; }
[data-theme="przyklady"] .inputs li { display: flex; align-items: flex-start; gap: 8px; font-size: 13px; line-height: 1.4; padding: 7px 9px; border: 1.5px solid var(--k); border-radius: 6px; }
[data-theme="przyklady"] .key {
  display: inline-grid; place-items: center; flex: none; width: 22px; height: 22px; border-radius: 50%;
  background: var(--k); color: #ffffff; font-family: "Geist Mono", monospace; font-size: 11px; font-weight: 600;
}
[data-theme="przyklady"] [data-k="a"], [data-theme="przyklady"] li:has([data-k="a"]), [data-theme="przyklady"] .node:has(h3 [data-k="a"]) { --k: var(--k-a); }
[data-theme="przyklady"] [data-k="b"], [data-theme="przyklady"] li:has([data-k="b"]), [data-theme="przyklady"] .node:has(h3 [data-k="b"]) { --k: var(--k-b); }
[data-theme="przyklady"] [data-k="c"], [data-theme="przyklady"] li:has([data-k="c"]), [data-theme="przyklady"] .node:has(h3 [data-k="c"]) { --k: var(--k-c); }
[data-theme="przyklady"] .node h3 .key { width: 26px; height: 26px; font-size: 12px; }
[data-theme="przyklady"] .node:has(h3 .key) { border: 2px solid var(--k); }
[data-theme="przyklady"] .node.alt:has(h3 .key) { border-style: dashed; }
[data-theme="przyklady"] .node:has(h3 .key) .icon { color: var(--k); }
[data-theme="przyklady"] .cond { display: block; font-size: 12.5px; font-style: italic; color: var(--soft-fg); margin: -2px 0 2px; }
[data-theme="przyklady"] .same { display: block; margin-top: 10px; padding-top: 8px; border-top: 1px dashed #a1a1aa; font-family: "Geist Mono", monospace; font-size: 10.5px; color: var(--soft-fg); }

/* ─── Base ─── */
* { box-sizing: border-box; }
body { margin: 0; background: var(--page-bg); color: var(--page-fg); font-family: var(--font-body); font-size: var(--body-size); line-height: 1.5; -webkit-font-smoothing: antialiased; transition: background 0.25s; }
h2, h3, p { margin: 0; }
main { padding: var(--gutter); display: flex; flex-direction: column; gap: clamp(40px, 6vw, 80px); }
.icon { width: 18px; height: 18px; flex: none; stroke-width: 1.75; color: var(--icon-color); }

/* ─── Chrome: variant switcher ─── */
.chrome { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 6px 14px; flex-wrap: wrap; padding: 10px var(--gutter); background: var(--chrome-bg); color: var(--chrome-fg); border-bottom: 1.5px solid var(--chrome-line); font-family: var(--chrome-font); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; }
.chrome .ttl { font-weight: 600; margin-right: 6px; }
.chrome .opts { display: flex; flex-wrap: wrap; gap: 4px; }
.chrome button { font: inherit; letter-spacing: inherit; text-transform: inherit; color: var(--chrome-fg); background: var(--chrome-bg); border: 1px solid var(--chrome-line); padding: 6px 10px; cursor: pointer; }
.chrome button kbd { font: inherit; opacity: 0.55; margin-right: 6px; }
.chrome button[aria-pressed="true"] { background: var(--chrome-fg); color: var(--chrome-bg); }
.chrome .hint { margin-left: auto; text-transform: none; letter-spacing: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ─── Figure ─── */
.fig { margin: 0; background: var(--fig-pattern), var(--fig-bg); border: var(--fig-border); border-top: var(--fig-border-top, var(--fig-border)); border-bottom: var(--fig-border-bottom, var(--fig-border)); border-radius: var(--fig-radius); box-shadow: var(--fig-shadow); padding: var(--fig-pad); }
.fig-head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 26px; flex-wrap: wrap; }
.fig-no { font-family: var(--font-label); font-size: var(--label-size); font-weight: var(--label-weight); letter-spacing: var(--label-tracking); text-transform: var(--label-transform); font-style: var(--label-style); color: var(--step-color); }
.fig-title { font-family: var(--font-title); font-size: var(--title-size); font-weight: var(--title-weight); letter-spacing: var(--title-tracking); text-transform: var(--title-transform); font-style: var(--title-style); line-height: 1.2; }
.caption { font-size: calc(var(--body-size) - 1.5px); color: var(--soft-fg); max-width: 80ch; }

/* ─── Flow ─── */
.flowz { display: grid; grid-template-columns: 1fr var(--link-w) 1.15fr var(--link-w) 1.15fr; align-items: center; }
.node { --bg: var(--node-bg); --fg: var(--node-fg); background: var(--bg); color: var(--fg); border: var(--node-border); border-top: var(--node-border-top, var(--node-border)); border-radius: var(--node-radius); box-shadow: var(--node-shadow); padding: 18px 18px 16px; }
.node[data-step="1"] { --bg: var(--n1-bg); --fg: var(--n1-fg); }
.node[data-step="2"] { --bg: var(--n2-bg); --fg: var(--n2-fg); }
.node[data-step="3"] { --bg: var(--n3-bg); --fg: var(--n3-fg); }
.node.alt { --bg: var(--alt-bg); --fg: var(--alt-fg); border-style: var(--alt-border-style); }
.step-no { font-family: var(--font-label); font-size: var(--label-size); font-weight: var(--label-weight); letter-spacing: var(--label-tracking); text-transform: var(--label-transform); font-style: var(--label-style); color: var(--step-color); display: inline-flex; align-items: center; gap: 8px; }
.step-no::after { content: ""; width: 26px; height: 1.5px; background: currentColor; }
.node h3 { font-family: var(--font-title); font-size: var(--node-title-size); font-weight: var(--node-title-weight); text-transform: none; line-height: 1.25; letter-spacing: -0.01em; margin: 10px 0 6px; display: flex; align-items: center; gap: 9px; }
.node[data-step] .icon { color: var(--icon-color); }
[data-theme="kolor"] .node .icon { color: currentColor; }
.quote { font-size: calc(var(--body-size) - 1px); line-height: 1.55; font-style: var(--quote-style); }
.quote::before { content: "\201E"; }
.quote::after { content: "\201D"; }
.checks { display: flex; flex-direction: column; gap: 7px; margin-top: 4px; }
.check { display: flex; align-items: flex-start; gap: 8px; font-family: var(--font-meta); font-size: var(--meta-size); line-height: 1.5; }
.check .icon { width: 13px; height: 13px; margin-top: 2px; }
.badge { margin-top: 10px; display: inline-flex; align-items: flex-start; gap: 7px; font-family: var(--font-meta); font-size: var(--meta-size); line-height: 1.5; padding: 6px 10px; background: var(--badge-bg); color: var(--badge-fg); border: var(--badge-border); border-radius: var(--badge-radius); }
.badge .icon { width: 13px; height: 13px; margin-top: 2px; color: currentColor; }
.node.alt .badge { background: var(--alt-badge-bg); color: var(--alt-badge-fg); border: var(--alt-badge-border); }

.link { width: 100%; height: 14px; display: block; }
.link line { stroke: var(--link-color); stroke-width: var(--link-width, 1.5); stroke-dasharray: var(--link-dash, 4 5); }
.link path { fill: var(--link-color); }
.branch-links { display: flex; flex-direction: column; align-self: stretch; justify-content: space-around; }
.branch-targets { display: flex; flex-direction: column; gap: 18px; }

/* ─── Optional input/condition elements (hidden unless a theme shows them) ─── */
.inputs, .same, .cond, .or, .key, .decision { display: none; }
.inputs { list-style: none; margin: 4px 0 0; padding: 0; flex-direction: column; gap: 6px; }
.node h3 .key { margin-left: auto; }

/* ─── Plain language ─── */
.plain { display: grid; grid-template-columns: 1fr var(--link-w) 1fr; align-items: stretch; }
.plain .link-cell { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 6px; }
.plain .link-cell span { font-family: var(--font-label); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; writing-mode: vertical-rl; color: var(--link-color); }
.letter { font-size: var(--body-size); line-height: 1.65; margin: 4px 0 14px; }
.stats { font-family: var(--font-meta); font-size: var(--meta-size); margin-bottom: 8px; }
.bars { display: flex; flex-direction: column; gap: 4px; }
.bars i { display: block; height: 8px; background: currentColor; width: var(--w); border-radius: var(--bar-radius); }
.node.alt .bars i { background: repeating-linear-gradient(135deg, currentColor 0 1.5px, transparent 1.5px 5px); border: 1px solid currentColor; }
.swaps { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 22px; }
.swap { font-family: var(--font-meta); font-size: var(--meta-size); border: var(--swap-border); border-radius: var(--swap-radius); display: inline-flex; overflow: hidden; }
.swap s, .swap b { padding: 5px 10px; }
.swap s { background: var(--swap-old-bg); color: var(--swap-old-fg); }
.swap b { background: var(--swap-new-bg); color: var(--swap-new-fg); font-weight: 600; }

/* ─── Responsive ─── */
@media (max-width: 768px) {
  .chrome .hint { display: none; }
  .flowz, .plain { grid-template-columns: 1fr; }
  .link { height: 34px; width: 14px; margin: 0 auto; transform: rotate(90deg); }
  .branch-links { flex-direction: row; justify-content: center; gap: 60px; }
  .plain .link-cell { flex-direction: row; padding: 4px 0; }
  .plain .link-cell span { writing-mode: horizontal-tb; }
}
@media print { .chrome { display: none; } }
@media (prefers-reduced-motion: reduce) { body { transition: none; } }
</style>
</head>

  </div>
  <div class="swaps" aria-label="Przykładowe zamiany">
    <span class="swap"><s>Odbiorca usług</s><b>Pan</b></span>
    <span class="swap"><s>dokona korekty należności</s><b>poprawimy rachunek</b></span>
    <span class="swap"><s>zaliczona na poczet przyszłych należności</s><b>odliczymy od kolejnego rachunku</b></span>
    <span class="swap"><s>w terminie 14 dni od dnia otrzymania</s><b>do 3 listopada</b></span>
  </div>
</figure>

<p class="caption">Ilustracje poglądowe. Przykład: fikcyjne przedsiębiorstwo wodociągowo-kanalizacyjne; dokumenty, osoby i liczby są przykładowe. Paski na rys. 3 to długość kolejnych zdań w słowach.</p>

</main>

<script>
// ─── Constants ───
const THEMES = [
  { id: "kontur", name: "Kontur" },
  { id: "miekki", name: "Miękki" },
  { id: "quantica", name: "Quantica" },
  { id: "redakcja", name: "Redakcyjny" },
  { id: "plan", name: "Techniczny" },
  { id: "kolor", name: "Kolorowy" },
  { id: "rubryka", name: "Magazyn: rubryka" },
  { id: "pop", name: "Magazyn: pop" },
  { id: "rozjazd", name: "Rozjazd" },
  { id: "przyklady", name: "Przykłady" }
];
const STORAGE_KEY = "zk-ilustracje-theme";
const WORD_RE = /[\p{L}\p{N}]+(?:[.,\/\-][\p{L}\p{N}]+)*/gu;
const SENTENCE_SPLIT_RE = /(?<=[.?!])\s+/;

// ─── State ───
const state = { theme: THEMES[0].id };

// ─── DOM refs ───
const el = {
  root: document.documentElement,
  opts: document.getElementById("themeOpts"),
  live: document.getElementById("liveRegion")
};

// ─── Helpers ───
const countWords = (s) => (s.match(WORD_RE) || []).length;
const plural = (n, one, few, many) => {
  if (n === 1) return one;
  const r10 = n % 10, r100 = n % 100;
  return r10 >= 2 && r10 <= 4 && (r100 < 12 || r100 > 14) ? few : many;
};
const analyse = (text) => {
  const lengths = text.trim().split(SENTENCE_SPLIT_RE).map(countWords);
  const total = lengths.reduce((a, b) => a + b, 0);
  return { lengths, total, avg: total / lengths.length };
};
const storage = {
  get() { try { return localStorage.getItem(STORAGE_KEY); } catch { return null; } },
  set(v) { try { localStorage.setItem(STORAGE_KEY, v); } catch { /* storage unavailable */ } }
};
const themeFromHash = () => {
  const n = parseInt(location.hash.replace("#v", ""), 10);
  return THEMES[n - 1] ? THEMES[n - 1].id : null;
};

// ─── Render ───
function renderSwitcher() {
  el.opts.innerHTML = THEMES.map((t, i) =>
    `<button type="button" data-theme-id="${t.id}" aria-pressed="false"><kbd>${i + 1}</kbd>${t.name}</button>`).join("");
}

function applyTheme(id, announce) {
  const i = THEMES.findIndex((t) => t.id === id);
  if (i < 0) return;
  state.theme = id;
  el.root.dataset.theme = id;
  el.opts.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.themeId === id)));
  history.replaceState(null, "", "#v" + (i + 1));
  storage.set(id);
  if (announce) el.live.textContent = `Wariant ${i + 1}: ${THEMES[i].name}`;
}

function renderPlain() {
  const data = {};
  document.querySelectorAll("[data-text]").forEach((p) => { data[p.dataset.text] = analyse(p.textContent); });
  const max = Math.max(...Object.values(data).flatMap((d) => d.lengths));
  Object.entries(data).forEach(([key, d]) => {
    const n = d.lengths.length;
    document.querySelector(`[data-stats="${key}"]`).textContent =
      `${n} ${plural(n, "zdanie", "zdania", "zdań")} · średnio ${d.avg.toLocaleString("pl-PL", { maximumFractionDigits: 1 })} ${Number.isInteger(d.avg) ? plural(d.avg, "słowo", "słowa", "słów") : "słowa"} na zdanie`;
    document.querySelector(`[data-bars="${key}"]`).innerHTML =
      d.lengths.map((len) => `<i style="--w:${(len / max) * 100}%" title="${len} ${plural(len, "słowo", "słowa", "słów")}"></i>`).join("");
  });
  document.body.dataset.sentencesBefore = data.before.lengths.length;
  document.body.dataset.sentencesAfter = data.after.lengths.length;
}

// ─── Listeners ───
el.opts.addEventListener("click", (e) => {
  const b = e.target.closest("button[data-theme-id]");
  if (b) applyTheme(b.dataset.themeId, true);
});
document.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const i = THEMES.findIndex((t) => t.id === state.theme);
  const n = e.key === "0" ? 10 : Number(e.key);
  if (/^[0-9]$/.test(e.key) && THEMES[n - 1]) applyTheme(THEMES[n - 1].id, true);
  else if (e.key === "ArrowRight") applyTheme(THEMES[(i + 1) % THEMES.length].id, true);
  else if (e.key === "ArrowLeft") applyTheme(THEMES[(i - 1 + THEMES.length) % THEMES.length].id, true);
});
window.addEventListener("hashchange", () => { const id = themeFromHash(); if (id) applyTheme(id, true); });

// ─── Init ───
renderSwitcher();
renderPlain();
applyTheme(themeFromHash() || storage.get() || THEMES[0].id, false);
if (window.lucide) lucide.createIcons();
</script>
</body>
</html>
